<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="🌹 Para María">
  <meta property="og:description" content="Toca para abrirlo (con sonido 🔊)">
  <title>🌹 Para María</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="frame" id="frame">
    <canvas id="screen" aria-label="Ramo de rosas en ASCII"></canvas>

    <div class="caption" id="caption" aria-live="polite"></div>

    <header class="tabs"><span>Siguiendo</span><span class="active">Para ti</span></header>

    <aside class="rail">
      <div class="avatar">B<span class="follow">+</span></div>
      <button class="rail-btn" id="like" type="button"><span class="icon">❤</span><span id="likes">8.341</span></button>
      <div class="rail-btn"><span class="icon">💬</span><span>1.204</span></div>
      <div class="rail-btn"><span class="icon">🔖</span><span>977</span></div>
      <div class="rail-btn"><span class="icon">↗</span><span>Compartir</span></div>
    </aside>

    <footer class="info">
      <div class="handle" id="handle"></div>
      <div class="desc" id="desc"></div>
      <div class="music"><span class="note">♫</span><div class="marquee"><span id="song"></span></div></div>
    </footer>
    <div class="disc">🌹</div>
    <div class="progress"><div id="progress"></div></div>

    <div class="yt" id="yt-wrap">
      <p>Toca ▶ en el vídeo para que suene la música</p>
      <div class="yt-box"><div id="yt"></div></div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <button class="start" id="start" type="button">
      <span class="rose">🌹</span>
      <span class="big">Tienes un regalo, María</span>
      <span class="small">Toca para abrirlo · sube el volumen 🔊</span>
    </button>

    <button class="replay" id="replay" type="button" hidden>↻ Ver otra vez</button>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
